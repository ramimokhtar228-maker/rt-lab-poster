<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#0ea5e9" stroke-width="6" stroke-opacity="0.3" />

  <!-- Outer Glowing Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-dasharray="16 12" stroke-opacity="0.4" />

  <!-- Medical Cross / DNA Halo -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#0284c7" stroke-width="4" stroke-opacity="0.2" />

  <!-- Central RT Badge Shield -->
  <rect x="96" y="96" width="320" height="320" rx="64" fill="url(#cyanGrad)" filter="url(#glow)" />
  <rect x="104" y="104" width="304" height="304" rx="56" fill="#030712" />

  <!-- RT Big Letters -->
  <text x="256" y="275" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="140" fill="#ffffff" text-anchor="middle" letter-spacing="4">RT</text>
  
  <!-- LABS Subtext -->
  <text x="256" y="340" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#38bdf8" text-anchor="middle" letter-spacing="8">LABS</text>

  <!-- Flash Discount 70% Badge -->
  <circle cx="390" cy="120" r="54" fill="url(#accentGrad)" filter="url(#glow)" stroke="#ffffff" stroke-width="3" />
  <text x="390" y="116" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">70%</text>
  <text x="390" y="142" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#fef08a" text-anchor="middle">OFF</text>
</svg>
